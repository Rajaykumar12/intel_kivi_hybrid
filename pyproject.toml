[build-system]
requires = ["setuptools>=77.0", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "kivi-sycl"
dynamic = ["version"]
description = "KIVI: Tuning-Free Asymmetric 2-bit KV Cache Quantization for Intel GPUs"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Rajay"},
]
keywords = ["kv-cache", "quantization", "2-bit", "sycl", "intel", "xpu", "llm", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "torch",
    "transformers",
]

[project.urls]
Homepage = "https://github.com/Rajaykumar12/intel_kivi_hybrid"
Repository = "https://github.com/Rajaykumar12/intel_kivi_hybrid"
Issues = "https://github.com/Rajaykumar12/intel_kivi_hybrid/issues"
Paper = "https://arxiv.org/abs/2402.02750"

[tool.setuptools.dynamic]
version = {attr = "kivi_sycl._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kivi_sycl*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
